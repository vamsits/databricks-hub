<style>
/* ============================================================
   DESIGN SYSTEM — Databricks Knowledge Hub
   Aesthetic: Editorial Tech / Refined Dark Intelligence
   ============================================================ */
:root {
  --bg-primary: #0a0b0e;
  --bg-secondary: #111318;
  --bg-card: #161920;
  --bg-elevated: #1c2029;
  --bg-hover: #222635;
  --border: #252a38;
  --border-bright: #2d3348;
  --text-primary: #e8eaf0;
  --text-secondary: #8b92a8;
  --text-muted: #555e78;
  --accent-red: #ff3c3c;
  --accent-orange: #ff6b35;
  --accent-amber: #f59e0b;
  --accent-teal: #00c2a8;
  --accent-blue: #3b82f6;
  --accent-purple: #7c3aed;
  --gradient-hero: linear-gradient(135deg, #0a0b0e 0%, #0f1420 40%, #0a1628 100%);
  --gradient-accent: linear-gradient(135deg, #ff3c3c, #ff6b35);
  --gradient-teal: linear-gradient(135deg, #00c2a8, #3b82f6);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 40px rgba(255,60,60,0.1);
  --font-display: Georgia, serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'Fira Code', monospace;
  --radius: 8px;
  --radius-lg: 16px;
  --nav-height: 64px;
}
[data-theme="light"] {
  --bg-primary: #f8f9fc;
  --bg-secondary: #ffffff;
  --bg-card: #ffffff;
  --bg-elevated: #f0f2f8;
  --bg-hover: #e8eaf4;
  --border: #dde1ed;
  --border-bright: #c8cfe0;
  --text-primary: #0f1420;
  --text-secondary: #4a5270;
  --text-muted: #8b96b8;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-glow: 0 0 40px rgba(255,60,60,0.05);
  --gradient-hero: linear-gradient(135deg, #f8f9fc 0%, #eef1fa 50%, #e8f0ff 100%);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.7;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}
/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== TYPOGRAPHY ===== */
h1, h2, h3, h4, h5 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; color: var(--text-primary); }
h1 { font-size: clamp(2.4rem, 5vw, 4.5rem); }
h2 { font-size: clamp(1.8rem, 3.5vw, 2.8rem); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
h3 { font-size: clamp(1.3rem, 2.5vw, 1.8rem); margin-top: 1.5rem; margin-bottom: 0.75rem; }
h4 { font-size: 1.15rem; font-family: var(--font-body); font-weight: 600; margin-bottom: 0.5rem; }
p { color: var(--text-secondary); margin-bottom: 1rem; }
a { color: var(--accent-teal); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--accent-orange); }
code { font-family: var(--font-mono); font-size: 0.875em; background: var(--bg-elevated); color: var(--accent-teal); padding: 0.15em 0.4em; border-radius: 4px; }
pre { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; overflow-x: auto; position: relative; margin: 1.25rem 0; }
pre code { background: none; padding: 0; color: var(--text-primary); font-size: 0.85rem; line-height: 1.7; }
.kw { color: #ff6b9d; font-weight: bold; }
.str { color: #a8ff78; }
.cm { color: #6b7a99; font-style: italic; }
.fn { color: #79d8ff; font-weight: bold; }
.num { color: #ffb347; }
.var { color: #e8eaf0; }
.op { color: var(--accent-teal); }

/* ===== LAYOUT ===== */
.container { max-width: 1280px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem); }
.container-narrow { max-width: 900px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.5rem); }
section { padding: clamp(3rem, 8vw, 6rem) 0; border-bottom: 1px solid var(--border); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-2 { gap: 0.5rem; }
.gap-4 { gap: 1rem; }
.gap-6 { gap: 1.5rem; }

/* ===== NAVBAR ===== */
#navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-height);
  background: rgba(10,11,14,0.85);
  backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border);
  transition: all 0.3s;
}
[data-theme="light"] #navbar { background: rgba(248,249,252,0.9); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: var(--nav-height); gap: 1.5rem; }
.nav-logo { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--text-primary); text-decoration: none; white-space: nowrap; }
.nav-logo-icon { width: 32px; height: 32px; background: var(--gradient-accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; color: white; }
.nav-links { display: flex; align-items: center; gap: 0.25rem; }
.nav-links a { padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); transition: all 0.2s; }
.nav-links a:hover { color: var(--text-primary); background: var(--bg-elevated); }
.nav-links a.active { color: var(--text-primary); background: var(--bg-elevated); }
.nav-actions { display: flex; align-items: center; gap: 0.5rem; }
.nav-search { display: flex; align-items: center; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 0.35rem 0.75rem; gap: 0.5rem; transition: all 0.2s; }
.nav-search:hover { border-color: var(--accent-teal); }
.nav-search input { background: none; border: none; outline: none; color: var(--text-primary); font-family: var(--font-body); font-size: 0.85rem; width: 160px; }
.nav-search input::placeholder { color: var(--text-muted); }
.btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; font-family: var(--font-body); }
.btn-primary { background: var(--gradient-accent); color: white; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); color: white; box-shadow: 0 8px 20px rgba(255,60,60,0.3); }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--accent-teal); color: var(--accent-teal); }
.theme-toggle { width: 36px; height: 36px; border-radius: 8px; background: var(--bg-elevated); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.2s; color: var(--text-primary); }
.theme-toggle:hover { background: var(--bg-hover); border-color: var(--accent-teal); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 6px; background: none; border: none; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text-secondary); border-radius: 2px; transition: all 0.3s; }

/* ===== HERO ===== */
#hero {
  min-height: 70vh;
  background: var(--gradient-hero);
  display: flex; align-items: center;
  padding-top: calc(var(--nav-height) + 2rem);
  position: relative;
  overflow: hidden;
}
#hero::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
  background: linear-gradient(to top, var(--bg-primary), transparent);
  pointer-events: none;
}
.hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 3rem; align-items: center; }
.hero-tag { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.2); color: var(--accent-orange); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.5rem; }
.hero-title { margin-bottom: 1.5rem; letter-spacing: -0.02em; }
.hero-title span { background: var(--gradient-accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero-desc { font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 2rem; max-width: 640px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
.stat-num { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--text-primary); }
.stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ===== CARDS & INTERACTIVE ELEMENTS ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}
.card:hover { border-color: var(--border-bright); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.card-accent-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-accent); }
.card-teal-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-teal); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
.badge { display: inline-flex; align-items: center; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.badge-orange { background: rgba(255,107,53,0.15); color: var(--accent-orange); border: 1px solid rgba(255,107,53,0.3); }
.badge-teal { background: rgba(0,194,168,0.15); color: var(--accent-teal); border: 1px solid rgba(0,194,168,0.3); }
.badge-purple { background: rgba(124,58,237,0.15); color: var(--accent-purple); border: 1px solid rgba(124,58,237,0.3); }
.badge-blue { background: rgba(59,130,246,0.15); color: var(--accent-blue); border: 1px solid rgba(59,130,246,0.3); }

/* ACCORDIONS */
.accordion { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-card); margin-bottom: 1rem; }
.accordion-header { padding: 1.25rem 1.5rem; background: var(--bg-card); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; transition: background 0.2s; }
.accordion-header:hover { background: var(--bg-elevated); }
.accordion-title { font-family: var(--font-body); font-weight: 600; font-size: 1.05rem; color: var(--text-primary); display: flex; align-items: center; gap: 0.75rem; }
.accordion-icon { transition: transform 0.3s; color: var(--text-muted); }
.accordion-item.active .accordion-icon { transform: rotate(180deg); color: var(--accent-teal); }
.accordion-content { display: none; padding: 1.5rem; border-top: 1px solid var(--border); background: var(--bg-secondary); }
.accordion-item.active .accordion-content { display: block; }

/* TABS */
.tab-container { margin: 1.5rem 0; }
.tab-nav { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; overflow-x: auto; }
.tab-btn { padding: 0.5rem 1rem; border-radius: 6px; background: none; border: none; color: var(--text-secondary); font-family: var(--font-body); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.tab-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
.tab-btn.active { color: var(--accent-teal); background: var(--bg-elevated); border-bottom: 2px solid var(--accent-teal); }
.tab-content { display: none; padding-top: 1.25rem; }
.tab-content.active { display: block; }

/* CALLOUTS */
.callout { padding: 1.25rem 1.5rem; border-radius: var(--radius); border-left: 4px solid var(--accent-teal); background: rgba(0,194,168,0.05); margin: 1.25rem 0; }
.callout-warning { border-left-color: var(--accent-amber); background: rgba(245,158,11,0.05); }
.callout-title { font-weight: 700; color: var(--text-primary); margin-bottom: 0.4rem; font-size: 0.95rem; }

/* GLOSSARY & LISTS */
.glossary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
.glossary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; transition: border-color 0.2s; }
.glossary-card:hover { border-color: var(--accent-teal); }
.glossary-term { font-family: var(--font-mono); font-weight: 600; color: var(--accent-teal); margin-bottom: 0.4rem; font-size: 1rem; }

/* FOOTER */
footer { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 3rem 0 2rem 0; font-size: 0.875rem; color: var(--text-muted); }

/* RESPONSIVE */
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 2rem; }
  .nav-links { display: none; }
  .nav-links.mobile-open { display: flex; flex-direction: column; position: absolute; top: var(--nav-height); left: 0; right: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 1rem; gap: 0.5rem; }
  .hamburger { display: flex; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
